{% extends "layout.html" %}
{% block content %}
<div class="container-fluid">
  <div class="page-header d-print-none mb-3"><h1>修改密码</h1></div>
  <div class="card" style="max-width:480px">
    <div class="card-body">
      {% if msg %}
      <div class="alert {% if ok %}alert-success{% else %}alert-danger{% endif %}" role="alert">{{ msg }}</div>
      {% endif %}
      <form method="post" action="{{ request.url }}">
        <div class="mb-3">
          <label class="form-label">当前密码</label>
          <input type="password" class="form-control" name="current_password" autocomplete="current-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">新密码(至少 8 位)</label>
          <input type="password" class="form-control" name="new_password" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">确认新密码</label>
          <input type="password" class="form-control" name="confirm_password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <span class="text-muted small ms-2">保存后所有旧登录令牌将失效, 需重新登录。</span>
      </form>
    </div>
  </div>
</div>
{% endblock %}
